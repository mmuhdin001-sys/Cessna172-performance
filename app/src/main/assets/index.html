
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Takeoff EFB Pro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            font-size: 17px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>C172 Performance</h1>

    <label>Pressure Altitude (ft)</label>
    <input id="altitude" type="number" value="0">

    <label>OAT (°C)</label>
    <input id="temperature" type="number" value="15">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

</div>

<script>
function calculate() {

    const altitude = Number(document.getElementById("altitude").value);
    const temperature = Number(document.getElementById("temperature").value);

    const standardTemp = 15 - (2 * altitude / 1000);
    const densityAltitude =
        altitude + 120 * (temperature - standardTemp);

    document.getElementById("result").innerHTML =
        "Estimated Density Altitude: " +
        Math.round(densityAltitude) + " ft";
}
</script>

</body>
</html>
